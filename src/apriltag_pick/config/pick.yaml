apriltag_pick:
  ros__parameters:
    tag_frame: "tag36h11:0"
    handeye_path: "/home/ylx/Robot_Arm_Project/scripts/handeye_calib_runs/handeye_20260707_174738/handeye_chessboard_result.json"
    tcp_calibration_path: "/home/ylx/Robot_Arm_Project/scripts/tcp_calibration/tcp_calibration_20260706_150548.json"
    robot_speed: 15

    # 首次必须保持 false，只做 l 定位验证；确认坐标后再改 true。
    execute_enabled: true
    samples: 10
    sample_window_sec: 2.0
    max_detection_age_sec: 1.0
    max_sample_spread_mm: 8.0
    min_base_z_mm: 20.0
    max_base_radius_mm: 850.0
    pregrasp_height_mm: 80.0
    lift_height_mm: 100.0

    # Tag 到真实针尖的接触点偏移。
    # 工具姿态保持拖拽结束时的当前姿态，避免被 Tag 旋转带跑。
    tag_to_tcp:
      xyz_mm: [0.0, 0.0, 0.0]

    # 若夹爪由 CR5 末端数字输出控制，确认端口和电平后启用。
    gripper:
      enabled: false
      index: 1
      active_high: true
